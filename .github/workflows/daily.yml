name: Daily tracker update

on:
  schedule:
    - cron: "17 21 * * 1-5"   # weekdays, 21:17 UTC, after the US and European curves update
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        run: python rates_pricing_tracker.py

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates_pricing.png rates_pricing_history.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update tracker outputs $(date -u +%F)"
            git push
          fi
